name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # linen's native build dependencies (it builds its FFI as a dependency),
      # from linen's own list at the version lode requires.
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.10.0
        with:
          keyring: false
      - run: sudo apt-get install -y jq
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - run: lake test
      # A real agent loop over a real repository, with a scripted model.
      - run: test/e2e.sh
      # The GitHub/GitLab and model paths, against a mock liaison.
      - run: test/liaison.sh

  # lode against a real lun (>= 0.2.0: functions and graphs, on linen's released
  # `Control.Reactive`), with a linen checkout for the test project's path
  # dependency, both next to lode, as `test/lun.sh` expects.
  lun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: lode
      - uses: actions/checkout@v7
        with:
          repository: typednotes/lun
          ref: ${{ vars.LUN_E2E_REF || 'v0.3.0' }}
          path: lun
      - uses: actions/checkout@v7
        with:
          repository: typednotes/linen
          ref: ${{ vars.LINEN_E2E_REF || 'v1.10.0' }}
          path: linen
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.10.0
        with:
          keyring: false
      - run: sudo apt-get install -y jq
      - run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lode/test/lun.sh lun linen
