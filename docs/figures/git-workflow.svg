<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">From a checkout to a published build</title>
  <desc id="desc">Start from a committed source branch A. Lode opens a separate checkout, edits and checks it, and can expose its unpublished diff. Publish creates commit B on the shared branch. Lun then builds that exact published commit, not the uncommitted checkout.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52617a"/></marker></defs>
  <rect width="1000" height="420" rx="20" fill="#f7f8fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18243b">
    <text x="36" y="44" font-size="13" font-weight="700" letter-spacing="2" fill="#6653a1">03 / SOURCE TO RUNTIME</text>
    <text x="36" y="80" font-size="27" font-weight="700">Three checkpoints, one shared branch</text>
    <g class="card">
      <rect x="36" y="159" width="190" height="151" rx="14" fill="#e7f4ef" stroke="#69a890"/>
      <text x="54" y="193" font-size="20" font-weight="700" fill="#22634e">Source branch</text>
      <text x="54" y="225" font-size="17">main → commit A</text>
      <text x="54" y="259" font-size="16">Committed files only</text>
      <text x="54" y="284" font-size="16">Local bare or hosted</text>
    </g>
    <path d="M 226 233 H 264" fill="none" stroke="#52617a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="246" y="142" font-size="13" text-anchor="middle" fill="#52617a">open</text>
    <g class="card">
      <rect x="273" y="159" width="211" height="151" rx="14" fill="#eee9fa" stroke="#8d79bd"/>
      <text x="291" y="193" font-size="20" font-weight="700" fill="#5b438c">Session checkout</text>
      <text x="291" y="225" font-size="17">Read · edit · check</text>
      <text x="291" y="259" font-size="16">Unpublished changes</text>
      <text x="291" y="284" font-size="16">Inspect with /diff</text>
    </g>
    <path d="M 484 233 H 526" fill="none" stroke="#52617a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="504" y="142" font-size="13" text-anchor="middle" fill="#52617a">publish</text>
    <g class="card">
      <rect x="535" y="159" width="195" height="151" rx="14" fill="#e7f4ef" stroke="#69a890"/>
      <text x="553" y="193" font-size="20" font-weight="700" fill="#22634e">Published</text>
      <text x="553" y="225" font-size="17">main → commit B</text>
      <text x="553" y="259" font-size="16">Code + lun.json</text>
      <text x="553" y="284" font-size="16">Recorded remoteHead</text>
    </g>
    <path d="M 730 233 H 765" fill="none" stroke="#52617a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="748" y="142" font-size="13" text-anchor="middle" fill="#52617a">build</text>
    <g class="card">
      <rect x="774" y="159" width="190" height="151" rx="14" fill="#fff1d9" stroke="#cda75c"/>
      <text x="792" y="193" font-size="20" font-weight="700" fill="#80591a">Lun build</text>
      <text x="792" y="225" font-size="17">Exact commit B</text>
      <text x="792" y="259" font-size="16">Signatures + graphs</text>
      <text x="792" y="284" font-size="16">Ready → call services</text>
    </g>
    <text x="36" y="354" font-size="17" fill="#52617a">A clean check validates the project. A ready Lun build also checks the declared services.</text>
    <text x="36" y="382" font-size="17" fill="#52617a">The original working directory stays separate until you fetch the published commit.</text>
  </g>
</svg>
